[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "PolyForm-Shield-1.0.0"
publish = false

[workspace.dependencies]
voxear_assets = { path = "crates/voxear_assets" }
voxear_core = { path = "crates/voxear_core" }
voxear_ecs = { path = "crates/voxear_ecs" }
voxear_scene = { path = "crates/voxear_scene" }
voxear_rhi = { path = "crates/voxear_rhi" }
voxear_render = { path = "crates/voxear_render" }
voxear_scripting = { path = "crates/voxear_scripting" }
voxear_engine = { path = "crates/voxear_engine" }

anyhow = "1"
ash = "0.38"
ash-window = "0.13"
raw-window-handle = "0.6"
winit = "0.30"
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"] }
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
libloading = "0.9"
gltf = { version = "1.4", features = ["KHR_materials_emissive_strength"] }
png = "0.18"
# Already in the build through gltf; used directly to load glTF files from memory.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.13"
lz4_flex = "0.11"
meshopt = "0.7"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Keep dependencies fast in debug builds so the engine stays usable while iterating.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = "line-tables-only"
