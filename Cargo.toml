[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "PolyForm-Shield-1.0.0"
publish = false

[workspace.dependencies]
voxear_assets = { path = "crates/voxear_assets" }
voxear_audio = { path = "crates/voxear_audio" }
voxear_ui = { path = "crates/voxear_ui" }
voxear_core = { path = "crates/voxear_core" }
voxear_ecs = { path = "crates/voxear_ecs" }
voxear_scene = { path = "crates/voxear_scene" }
voxear_rhi = { path = "crates/voxear_rhi" }
voxear_render = { path = "crates/voxear_render" }
voxear_scripting = { path = "crates/voxear_scripting" }
voxear_engine = { path = "crates/voxear_engine" }
voxear_editor = { path = "crates/voxear_editor" }
voxear_docs = { path = "crates/voxear_docs" }
voxear_input = { path = "crates/voxear_input" }
voxear_physics = { path = "crates/voxear_physics" }
voxear_physics2d = { path = "crates/voxear_physics2d" }
voxear_localization = { path = "crates/voxear_localization" }
voxear_packages = { path = "crates/voxear_packages" }
voxear_net = { path = "crates/voxear_net" }
voxear_terrain = { path = "crates/voxear_terrain" }
voxear_voxshade = { path = "crates/voxear_voxshade" }

anyhow = "1"
ash = "0.38"
ash-window = "0.13"
raw-window-handle = "0.6"
winit = "0.30"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"] }
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
libloading = "0.9"
gltf = { version = "1.4", features = ["KHR_materials_emissive_strength"] }
png = "0.18"
# Already in the build through gltf; used directly to load glTF files from memory.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
base64 = "0.13"
lz4_flex = "0.11"
gdeflate = "0.4"
io-uring = "0.7"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Globalization"] }
taffy = { version = "0.15", features = ["parse"] }
cssparser = "0.37"
roxmltree = "0.21"
parley = "0.12"
swash = "0.2"
meshopt = "0.7"
# FBX models, read into the same form as glTF ones.
ufbx = "0.11"
uuid = { version = "1", features = ["v4"] }
# Tracy's client, for `--features tracy`: it collects only while the viewer
# is connected, and only from this machine, without announcing itself.
tracy-client = { version = "0.19", default-features = false, features = ["enable", "ondemand", "only-localhost"] }
tempfile = "3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
toml_edit = "0.25"
# Package versions and the ranges packages ask for; already in the build through rustc_version.
semver = "1"
serde_json = "1"
regex = "1"
tar = { version = "0.4", default-features = false }
zstd = "0.13"
tracing = "0.1"
# Sound out through the system's audio: ALSA on Linux (which PipeWire serves), WASAPI on Windows.
cpal = "0.18"
# Decodes sound files, with only the formats Voxear imports: WAV, OGG Vorbis, FLAC and MP3.
symphonia = { version = "0.6", default-features = false, features = ["opt-simd", "wav", "pcm", "adpcm", "ogg", "vorbis", "flac", "mp3"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Gamepads: XInput on Windows, evdev through udev on Linux, as SDL reads them.
gilrs = "0.11"
# Networking: ChaCha20-Poly1305 for every packet and the connect tokens, the system's randomness for keys,
# sockets with large buffers, and batched sends and receives on Linux.
chacha20poly1305 = "0.10"
getrandom = "0.3"
socket2 = "0.6"
libc = "0.2"
# 2D physics: Box2D v3, built from its C source, with ready-made bindings (no libclang needed).
boxdd-sys = "0.6"
# Language codes and their fallbacks (`pt-BR`, then `pt`), as ICU works them out; already in the build through
# parley's text segmentation.
icu_locale_core = "2.4"
icu_locale_fallback = "2.4"
# Plural rules (one, few, many…) and numbers written as each language writes them, for localized text.
icu_plurals = "2.4"
icu_decimal = "2.4"
# Dates and times, and amounts of money, written as each language writes them, for localized text.
icu_datetime = "2.4"
icu_calendar = "2.4"
icu_experimental = "0.7"
# Fetching a table's sheet from a URL, as a published Google Sheet, in the editor and `vox loc import`.
ureq = "3.5"

# Keep dependencies fast in debug builds so the engine stays usable while iterating.
# The engine's own crates are optimised a little in development and test builds, and carry line numbers only:
# tests of generation, meshing and the editor run several times faster for the same build time, and test
# programs are a third of the size. Backtraces still name files and lines.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = "line-tables-only"
