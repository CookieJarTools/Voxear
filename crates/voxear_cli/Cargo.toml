[package]
name = "voxear_cli"
description = "The `vox` command line: run, inspect and diagnose Voxear projects"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vox"
path = "src/main.rs"

[[bin]]
name = "voxear-editor"
path = "src/editor_main.rs"

[[bin]]
name = "voxear-player"
path = "src/player_main.rs"

[dependencies]
voxear_editor.workspace = true
voxear_core.workspace = true
voxear_engine.workspace = true
voxear_rhi.workspace = true
voxear_scripting.workspace = true
anyhow.workspace = true
serde_json.workspace = true
clap.workspace = true
voxear_scene.workspace = true
tracing.workspace = true
voxear_render.workspace = true
png.workspace = true
voxear_assets.workspace = true

[dev-dependencies]
tempfile.workspace = true
