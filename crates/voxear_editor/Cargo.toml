[package]
name = "voxear_editor"
description = "The Voxear editor: docked panels over the engine, built with Voxear UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
voxear_core.workspace = true
voxear_ecs.workspace = true
voxear_scene.workspace = true
voxear_terrain.workspace = true
voxear_shader_graph.workspace = true
voxear_rhi.workspace = true
voxear_render.workspace = true
voxear_ui.workspace = true
voxear_engine.workspace = true
voxear_net.workspace = true
# Its sheets fetched from their links.
voxear_localization = { workspace = true, features = ["fetch"] }
voxear_assets.workspace = true
voxear_scripting.workspace = true
voxear_docs.workspace = true
voxear_input.workspace = true
anyhow.workspace = true
tracing.workspace = true
winit.workspace = true
raw-window-handle.workspace = true
png.workspace = true
image.workspace = true
toml.workspace = true
toml_edit.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true

# Files dragged onto the window on Wayland, which winit does not pass on there.
[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = { version = "0.19", default-features = false }
wayland-backend = { version = "0.3", features = ["client_system"] }

[features]
# Profiling samples as Tracy zones: `cargo build --features tracy`.
tracy = ["voxear_engine/tracy"]

[dev-dependencies]
# Versions for the Package Manager's tests.
semver.workspace = true
tempfile.workspace = true
voxear_core.workspace = true
voxear_scripting.workspace = true
