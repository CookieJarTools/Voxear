[package]
name = "voxear_localization"
description = "The game's text in each of its languages: string tables, lookup and fallback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
icu_locale_core.workspace = true
icu_locale_fallback.workspace = true
icu_plurals.workspace = true
icu_decimal.workspace = true
icu_datetime.workspace = true
icu_calendar.workspace = true
icu_experimental.workspace = true
ureq = { workspace = true, optional = true }
toml.workspace = true
tracing.workspace = true

[features]
# Fetching a sheet from a URL, for the editor and `vox`; games do without.
fetch = ["dep:ureq"]

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
