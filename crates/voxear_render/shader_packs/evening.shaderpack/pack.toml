format = 1
description = "Long warm evenings: warm sun and cool shade on every block, leaves glowing against the sun, a golden path of sun on the water, a gold sky round a low sun, shafts of sun through the leaves, a golden haze and a warm grade of its own."

[options]
rays = { kind = "toggle", default = true, label = "Rays", about = "Shafts of sunlight where it breaks through leaves and between blocks" }
ray_strength = { kind = "number", range = [0.0, 2.0], default = 1.0, label = "Ray strength", about = "How bright the rays are" }
haze = { kind = "number", range = [0.0, 2.0], default = 1.0, label = "Haze", about = "How much warm haze the air holds, most towards the sun" }
warmth = { kind = "number", range = [0.0, 1.0], default = 0.7, label = "Warmth", about = "How far the grade warms the picture: golden light, cool shade" }
leaf_glow = { kind = "number", range = [0.0, 2.0], default = 1.0, label = "Leaf glow", about = "How much leaves glow with the sun through them, seen against a low sun" }
sky_glow = { kind = "number", range = [0.0, 2.0], default = 1.0, label = "Sky glow", about = "How gold the sky turns near the horizon and round a low sun, and the clouds on its side" }
curve = { kind = "choice", choices = ["Soft", "Filmic", "Neutral"], default = "Soft", label = "Curve", about = "How the light is fitted to the screen: Soft as the engine's, Filmic with more contrast, Neutral keeping colours as they are" }
glow = { kind = "number", range = [0.0, 3.0], default = 1.0, label = "Glow", about = "How much bright light glows round itself, where the bloom is on" }
vignette = { kind = "number", range = [0.0, 1.0], default = 0.5, label = "Vignette", about = "How much darker the corners are" }

# How block faces are lit: warm sun, cool shade, warm torchlight, and leaves lit through from behind; water: the sun's
# path on it golden; and the sky, gold round a low sun.
[surface]
blocks = "faces.slang"
water = "water.slang"
sky = "sky.slang"

# The sky round the sun, marched towards it from each pixel at half size: what stands in the way casts the shafts.
[[pass]]
name = "Rays"
program = "rays.slang"
at = "after_fog"
reads = ["color", "depth"]
writes = { target = "rays", format = "rgba16f", scale = 0.5 }

# The rays and the haze laid over the scene, before TAA, which smooths the rays' noise.
[[pass]]
name = "Evening light"
program = "light.slang"
at = "after_fog"
reads = ["color", "depth", "rays", "block_light"]

# Its own tonemap and grade in the engine's place: warm light and cool shade.
[[pass]]
name = "Evening grade"
program = "grade.slang"
at = "tonemap"
reads = ["color", "bloom"]
