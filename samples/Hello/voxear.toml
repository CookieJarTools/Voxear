[project]
name = "Hello"
scripts = "Scripts/Hello.Scripts.csproj"

# Objs created at startup, until scene assets land. Rotations are Euler
# degrees applied Z, X, then Y, as in Unity. The Game Manager is listed last on
# purpose: its [ExecutionOrder(-100)] still puts it first in every phase.

[[objs]]
name = "Main Camera"
position = [0.0, 2.2, -7.0]
rotation = [12.0, 0.0, 0.0]
camera = { fov = 55 }

[[objs]]
name = "Sun"
rotation = [42.0, -35.0, 0.0]
light = { type = "directional", color = [1.0, 0.95, 0.88], intensity = 3.2 }

[[objs]]
name = "Ground"
mesh = "plane"
scale = [30.0, 1.0, 30.0]
material = { color = [0.42, 0.44, 0.46], roughness = 0.9 }

[[objs]]
name = "Spinner A"
position = [-2.2, 0.75, 0.0]
mesh = "cube"
scale = [1.5, 1.5, 1.5]
material = { color = [0.55, 0.36, 0.96], roughness = 0.35 }
behaviours = ["Hello.Spinner"]

[[objs]]
name = "Spinner B"
position = [2.2, 0.75, 0.0]
rotation = [0.0, 30.0, 0.0]
mesh = "cube"
scale = [1.5, 1.5, 1.5]
material = { color = [0.24, 0.62, 0.98], roughness = 0.5 }
behaviours = ["Hello.Spinner"]

[[objs]]
name = "Chrome Ball"
position = [0.0, 0.9, 1.6]
mesh = "sphere"
scale = [1.8, 1.8, 1.8]
material = { color = [0.95, 0.93, 0.9], metallic = 1.0, roughness = 0.18 }

[[objs]]
name = "Pyramid"
position = [4.6, 0.0, 3.2]
scale = [2.0, 2.0, 2.0]
mesh = "Models/Pyramid.gltf"
behaviours = ["Hello.Spinner"]

[[objs]]
name = "Lamp"
position = [0.0, 0.6, -1.4]
light = { type = "point", color = [1.0, 0.45, 0.62], intensity = 6.0, range = 6.0 }

[[objs]]
name = "Glow"
position = [0.0, 0.25, -1.4]
mesh = "sphere"
scale = [0.3, 0.3, 0.3]
material = { color = [0.0, 0.0, 0.0], emissive = [6.0, 1.8, 3.0] }

[[objs]]
name = "Game Manager"
behaviours = ["Hello.GameManager"]
