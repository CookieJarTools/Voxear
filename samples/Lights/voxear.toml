[project]
name = "Lights"

# Night scene with 256 point lights in four colours among 100 pillars. Clustered
# lighting means each pixel shades only the handful of lights that reach it;
# `vox render samples/Lights --debug-view lights` shows how many per cluster.

[sky]
zenith = [0.02, 0.03, 0.08]
horizon = [0.06, 0.07, 0.14]
ground = [0.02, 0.02, 0.03]
ambient = 0.6

[[objs]]
name = "Main Camera"
position = [0.0, 16.0, -36.0]
rotation = [24.0, 0.0, 0.0]
camera = { fov = 60 }

[[objs]]
name = "Ground"
mesh = "plane"
scale = [120.0, 1.0, 120.0]
material = { color = [0.55, 0.55, 0.58], roughness = 0.6 }

[[objs]]
name = "Pillar"
position = [-27.0, 1.5, -27.0]
scale = [0.8, 3.0, 0.8]
mesh = "cube"
grid = [10, 1, 10]
spacing = [6.0, 1.0, 6.0]
material = { color = [0.8, 0.78, 0.74], roughness = 0.5 }

[[objs]]
name = "Violet light"
position = [-30.0, 0.8, -30.0]
light = { type = "point", color = [0.62, 0.38, 1.0], intensity = 8.0, range = 6.0 }
grid = [8, 1, 8]
spacing = [4.0, 1.0, 4.0]

[[objs]]
name = "Cyan light"
position = [2.0, 0.8, -30.0]
light = { type = "point", color = [0.25, 0.85, 1.0], intensity = 8.0, range = 6.0 }
grid = [8, 1, 8]
spacing = [4.0, 1.0, 4.0]

[[objs]]
name = "Pink light"
position = [-30.0, 0.8, 2.0]
light = { type = "point", color = [1.0, 0.35, 0.6], intensity = 8.0, range = 6.0 }
grid = [8, 1, 8]
spacing = [4.0, 1.0, 4.0]

[[objs]]
name = "Amber light"
position = [2.0, 0.8, 2.0]
light = { type = "point", color = [1.0, 0.72, 0.3], intensity = 8.0, range = 6.0 }
grid = [8, 1, 8]
spacing = [4.0, 1.0, 4.0]
